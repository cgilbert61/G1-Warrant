apiVersion: apps/v1
kind: Deployment
metadata:
  name: g1-warrant-extractor
  namespace: g1-warrant-system
  labels:
    app.kubernetes.io/name: g1-warrant-extractor
    app.kubernetes.io/part-of: g1-warrant
    tier: zero-privilege-extractor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: g1-warrant-extractor
  template:
    metadata:
      labels:
        app: g1-warrant-extractor
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: warrant-extractor
          image: ghcr.io/cgilbert61/g1-warrent/warrant-extractor@sha256:d4735e3a265e16eee03f59718b9b5d03019c07d8b6c51f90da3a666eec13ab35
          imagePullPolicy: Always
          env:
            - name: EXTRACTOR_LISTEN_ADDR
              value: ":8090"
          ports:
            - name: http-extract
              containerPort: 8090
              protocol: TCP
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: g1-warrant-extractor
  namespace: g1-warrant-system
  labels:
    app.kubernetes.io/name: g1-warrant-extractor
    app.kubernetes.io/part-of: g1-warrant
spec:
  type: ClusterIP
  selector:
    app: g1-warrant-extractor
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP

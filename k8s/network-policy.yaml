apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-warrant-default-deny-all
  namespace: g1-warrant-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-warrant-extractor-zero-egress
  namespace: g1-warrant-system
spec:
  podSelector:
    matchLabels:
      app: g1-warrant-extractor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: g1-warrantd
      ports:
        - protocol: TCP
          port: 8090
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: g1-warrantd-control-plane
  namespace: g1-warrant-system
spec:
  podSelector:
    matchLabels:
      app: g1-warrantd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: g1-warrant-extractor
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

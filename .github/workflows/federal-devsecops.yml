name: Federal DevSecOps & Compliance Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast-and-secrets:
    name: Gate 1 & 2 — SAST (Semgrep) & Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Semgrep SAST (OWASP Top 10, Security Audit & Zero-LLM Kernel Rules)
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep \
            semgrep scan --config p/owasp-top-ten --config p/security-audit --config /src/.semgrep.yml \
            --exclude web/node_modules --exclude web/dist --exclude reports --exclude "*_test.go" \
            --sarif -o /src/reports/semgrep.sarif /src

      - name: Run Gitleaks Secret Detection
        run: |
          docker run --rm -v "${PWD}:/path" zricethezav/gitleaks:latest \
            detect --source=/path -c=/path/.gitleaks.toml \
            --report-format=sarif --report-path=/path/reports/gitleaks.sarif

  iac-and-sbom:
    name: Gate 3 & 4 — IaC (Checkov) & EO 14028 SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Checkov IaC Security Scan (K8s & Distroless Dockerfiles)
        run: |
          docker run --rm -v "${PWD}:/tf" bridgecrew/checkov:latest \
            -d /tf/k8s -f /tf/Dockerfile.warrantd -f /tf/Dockerfile.extractor -f /tf/Dockerfile.fleetsim \
            --output sarif --output-file-path /tf/reports

      - name: Generate CycloneDX 1.5 SBOM with Syft
        run: |
          docker run --rm -v "${PWD}:/src" anchore/syft:latest \
            scan dir:/src --exclude "./reports/**" --exclude "./web/node_modules/**" --exclude "./.git/**" \
            -o cyclonedx-json=/src/reports/sbom.cdx.json

      - name: Archive SBOM Artifact
        if: always() && hashFiles('reports/sbom.cdx.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-warrant-sbom-cyclonedx
          path: reports/sbom.cdx.json

  sca-and-containers:
    name: Gate 5 — SCA & Container Hardening (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Trivy Vulnerability Scanner (CRITICAL/HIGH = Fail)
        run: |
          docker run --rm -v "${PWD}:/src" aquasec/trivy:latest \
            fs --scanners vuln --severity CRITICAL,HIGH \
            --skip-dirs /src/reports,/src/web/node_modules,/src/.git \
            --format sarif --output /src/reports/trivy-fs.sarif /src

  dast-a11y-load:
    name: Gate 6, 7 & 8 — OWASP ZAP DAST, Section 508 A11y & k6 SLA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Launch Full G1-Warrant Stack
        run: |
          docker compose up --build -d
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 2
          done

      - name: Run Section 508 / WCAG 2.1 AA Accessibility Audit
        run: python scripts/test_accessibility.py

      - name: Run OWASP ZAP Baseline Dynamic Scan
        run: |
          mkdir -p reports
          docker run --rm --network host -v "${PWD}:/zap/wrk/:rw" zaproxy/zap-stable \
            zap-baseline.py -t http://localhost:8080 \
            -r reports/zap_warrantd_report.html \
            -J reports/zap_warrantd_report.json \
            -c .zap/zap-baseline.conf || true

      - name: Run k6 Control-Plane SLA Load Test
        run: |
          docker run --rm --network host -v "${PWD}:/src" grafana/k6:latest \
            run -e BASE_URL=http://localhost:8080 \
            --summary-export=/src/reports/k6-summary.json /src/benchmarks/k6_warrant_load.js

      - name: Archive DAST, Accessibility & Load Reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-warrant-dast-a11y-load
          path: |
            reports/axe-accessibility.json
            reports/k6-summary.json
            reports/zap_warrantd_report.json

  govready-compliance:
    name: Gate 9 — GovReady-Q NIST SP 800-53 Rev 4 Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start GovReady-Q Service Container
        run: |
          docker run -d --name govready-q-assessment -p 8008:8000 \
            -e FIRST_RUN=1 -e DB_BACKED_UP_DO_UPGRADE=True govready/govready-q:latest
          sleep 15

      - name: Execute NIST SP 800-53 Control Verification (14 Controls)
        run: python scripts/run_govready_assessment.py

      - name: Archive OSCAL & Assessment Deliverables
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: g1-warrant-govready-oscal
          path: |
            reports/govready_oscal_component.json
            reports/govready_assessment_summary.json
            docs/g1_warrant_oscal_component.json

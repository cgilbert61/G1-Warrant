name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-kernel-and-console:
    name: Go Race Suite, OPA Rego AC-5 & React 19 Console
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Embedded Console UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run Embedded OPA Rego Policy & Go -race Invariant Suite
        run: |
          PG_PW="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD="${PG_PW}"
          export DATABASE_URL="postgres://warrant:${PG_PW}@postgres:5432/warrant?sslmode=disable"
          export TEST_DATABASE_URL="postgres://warrant:${PG_PW}@postgres:5432/postgres?sslmode=disable"
          docker compose --profile test run --rm --build verifier

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-warrant}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or environment}"
      POSTGRES_DB: "${POSTGRES_DB:-warrant}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - control_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant -d warrant"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  warrant-extractor:
    build:
      context: .
      dockerfile: Dockerfile.extractor
    environment:
      EXTRACTOR_LISTEN_ADDR: ":8090"
      WARRANT_EXTRACTOR_REQUIRE_TASK_POP: "true"
      WARRANT_KERNEL_PUBLIC_KEY_B64: "${WARRANT_KERNEL_PUBLIC_KEY_B64:-}"
      WARRANT_KERNEL_PUBLIC_KEY_FILE: "/var/lib/warrant-pubkeys/kernel_public_key.b64"
    volumes:
      - warrant_pubkeys:/var/lib/warrant-pubkeys:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - extractor_net
    restart: unless-stopped

  fleet-sim:
    build:
      context: .
      dockerfile: Dockerfile.fleetsim
    environment:
      FLEET_SIM_LISTEN_ADDR: ":8095"
      FLEET_SIM_REQUIRE_TASK_POP: "true"
      WARRANT_KERNEL_PUBLIC_KEY_B64: "${WARRANT_KERNEL_PUBLIC_KEY_B64:-}"
      WARRANT_KERNEL_PUBLIC_KEY_FILE: "/var/lib/warrant-pubkeys/kernel_public_key.b64"
    volumes:
      - warrant_pubkeys:/var/lib/warrant-pubkeys:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - fleet_net
    restart: unless-stopped

  warrantd:
    build:
      context: .
      dockerfile: Dockerfile.warrantd
    environment:
      WARRANTD_LISTEN_ADDR: ":8080"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env or environment}"
      EXTRACTOR_URL: "http://warrant-extractor:8090"
      FLEET_SIM_URL: "http://fleet-sim:8095"
      WEBAUTHN_RP_ID: "localhost"
      WEBAUTHN_RP_ORIGIN: "http://localhost:8080"
      WARRANT_POSTURE: "${WARRANT_POSTURE:-}"
      WARRANT_ENABLE_TEST_SMARTCARDS: "${WARRANT_ENABLE_TEST_SMARTCARDS:-false}"
      WARRANT_BOOTSTRAP_ADMIN_TOKEN: "${WARRANT_BOOTSTRAP_ADMIN_TOKEN:-}"
      WARRANT_OPERATOR_TOKEN: "${WARRANT_OPERATOR_TOKEN:-}"
      WARRANT_AUTOMATION_TOKEN: "${WARRANT_AUTOMATION_TOKEN:-}"
      WARRANT_INTAKE_TOKEN: "${WARRANT_INTAKE_TOKEN:-}"
      WARRANT_PUBLISHER_PUBLIC_KEY_B64: "${WARRANT_PUBLISHER_PUBLIC_KEY_B64:-}"
      WARRANT_PUBLISHER_SEED_HEX: "${WARRANT_PUBLISHER_SEED_HEX:-}"
      WARRANT_RULEPACK_PUBLIC_KEY_B64: "${WARRANT_RULEPACK_PUBLIC_KEY_B64:-}"
      WARRANT_RULEPACK_SEED_HEX: "${WARRANT_RULEPACK_SEED_HEX:-}"
      WARRANT_EXTERNAL_ANCHOR_URL: "${WARRANT_EXTERNAL_ANCHOR_URL:-}"
      WARRANT_KERNEL_KEY_PATH: "/var/lib/warrant-anchor/kernel_signer.json"
      WARRANT_KERNEL_PUBLIC_KEY_EXPORT_PATH: "/var/lib/warrant-pubkeys/kernel_public_key.b64"
      WARRANT_EXTERNAL_ANCHOR_PATH: "/var/lib/warrant-anchor/checkpoints.jsonl"
      WARRANT_IGA_TOKEN: "${WARRANT_IGA_TOKEN:-}"
      WARRANT_IGA_WEBHOOK_HMAC_SECRET: "${WARRANT_IGA_WEBHOOK_HMAC_SECRET:-}"
      WARRANT_FEED_MODE: "${WARRANT_FEED_MODE:-offline}"
      WARRANT_CISA_KEV_URL: "${WARRANT_CISA_KEV_URL:-https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json}"
      WARRANT_KEV_POLL_INTERVAL: "${WARRANT_KEV_POLL_INTERVAL:-1h}"
      WARRANT_OSV_API_URL: "${WARRANT_OSV_API_URL:-https://api.osv.dev/v1/querybatch}"
      WARRANT_TRIVY_ENABLED: "${WARRANT_TRIVY_ENABLED:-false}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - warrant_anchor:/var/lib/warrant-anchor
      - warrant_pubkeys:/var/lib/warrant-pubkeys
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      warrant-extractor:
        condition: service_started
      fleet-sim:
        condition: service_started
    networks:
      - host_edge_net
      - control_net
      - extractor_net
      - fleet_net
    restart: unless-stopped

  trivy-scanner:
    profiles:
      - live-feeds
    build:
      context: .
      dockerfile: Dockerfile.trivy
    environment:
      WARRANT_API_URL: "http://warrantd:8080"
      WARRANT_INTAKE_TOKEN: "${WARRANT_INTAKE_TOKEN:-}"
      WARRANT_TRIVY_ENABLED: "${WARRANT_TRIVY_ENABLED:-true}"
      WARRANT_TRIVY_TARGETS: "${WARRANT_TRIVY_TARGETS:-curlimages/curl:8.3.0=fulfillment-worker,nginx:1.24.0-alpine=checkout-cart-svc}"
      WARRANT_TRIVY_MAX_FINDINGS: "${WARRANT_TRIVY_MAX_FINDINGS:-2}"
      WARRANT_TRIVY_SCAN_INTERVAL_SEC: "${WARRANT_TRIVY_SCAN_INTERVAL_SEC:-3600}"
    volumes:
      - trivy_cache:/var/cache/trivy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - warrantd
    networks:
      - host_edge_net
    restart: unless-stopped

  verifier:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile.verifier
    environment:
      REQUIRE_DB_TESTS: "true"
      WARRANT_FEED_MODE: "offline"
      TEST_DATABASE_URL: "${TEST_DATABASE_URL:-postgres://${POSTGRES_USER:-warrant}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env or environment}@postgres:5432/postgres?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - control_net
      - extractor_net
      - fleet_net

networks:
  host_edge_net:
    driver: bridge
  control_net:
    driver: bridge
    internal: true
  extractor_net:
    driver: bridge
    internal: true
  fleet_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  warrant_anchor:
  warrant_pubkeys:
  trivy_cache:
